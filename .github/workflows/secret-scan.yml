name: Secret scan

# Every push to any branch, so a leak fails here even if it skipped the pre-commit hook.
# GitHub emails the pusher when this fails: that is the exposure alert for committed secrets.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Scan full history for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (default rules)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo \
            --redact --no-banner -v
